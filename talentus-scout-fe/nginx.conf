server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Certificados SSL para desarrollo local
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Resolver DNS interno de Docker con TTL corto para resolución dinámica
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Tamaño máximo de carga de archivos (para documentos de identidad, certificados y videos)
    client_max_body_size 500M;

    # Compresión gzip para optimizar transferencias móviles
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cabeceras de Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy reverso hacia Backend Spring Boot en talentus-net
    location /api/ {
        set $backend_upstream "http://talentus-scout-be:8080";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Proxy para archivos estáticos subidos (/uploads/**) hacia Spring Boot
    location ^~ /uploads/ {
        set $backend_upstream "http://talentus-scout-be:8080";
        proxy_pass $backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_hide_header X-Frame-Options;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Favicons y Metadatos de Navegador (sin caché inmutable para refresco inmediato de branding)
    location ~* ^/(?:favicon.*|apple-touch-icon.*)\.(?:ico|svg|png)$ {
        expires 1d;
        access_log off;
        log_not_found off;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }

    # Redirección de favicons solicitados en subrutas SPA hacia la raíz
    location ~ ^/.+/(favicon\.(?:ico|svg|png))$ {
        rewrite ^/.+/(favicon\.(?:ico|svg|png))$ /$1 permanent;
    }

    # Caché para activos estáticos con hash servidos directamente por Nginx
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webmanifest)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Perfil público de atletas con SSR (Open Graph dinámico para WhatsApp/Instagram/Twitter crawlers)
    location /atleta {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Soporte para Enrutamiento SPA en Angular (HTML5 History API)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
