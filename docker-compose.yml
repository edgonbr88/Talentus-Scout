services:
  # 1. BASE DE DATOS POSTGRESQL LOCAL
  docker-postgresql:
    image: postgres:16-alpine
    container_name: talentus-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword2026}
      POSTGRES_DB: ${POSTGRES_DB:-talentus_scout_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./postgresql/data:/var/lib/postgresql/data
    networks:
      - talentus-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-talentus_scout_dev}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. CONTENEDOR DE MIGRACIONES AUTOMÁTICAS (dbmate)
  dbmate:
    image: amacneil/dbmate:latest
    container_name: talentus-dbmate
    volumes:
      - ./talentus-scout-migrations:/db
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword2026}@docker-postgresql:5432/${POSTGRES_DB:-talentus_scout_dev}?sslmode=disable"
    depends_on:
      docker-postgresql:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: "/db/init_dbmate.sh"
    networks:
      - talentus-net

  # 3. BACKEND SPRING BOOT 3
  talentus-scout-be:
    build:
      context: ./talentus-scout-be
      dockerfile: Dockerfile
    image: talentus-scout-be:latest
    container_name: talentus-backend-dev
    ports:
      - "8080:8080"
    depends_on:
      dbmate:
        condition: service_completed_successfully
    environment:
      DB_HOST: docker-postgresql
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PWD: ${POSTGRES_PASSWORD:-postgrespassword2026}
      DB_NAME: ${POSTGRES_DB:-talentus_scout_dev}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      ENCRYPTION_SECRET_KEY: ${ENCRYPTION_SECRET_KEY:-clave_secreta_local_talentus_2026}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-super_secret_jwt_key_local_64_chars_talentus_scout_2026_dev_for_security}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM: ${MAIL_FROM:-contacto@robomatic.cloud}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-contacto@robomatic.cloud}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-vyuoxcjawklsgryu}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
    volumes:
      - ./talentus-scout-be/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks:
      - talentus-net

  # 4. FRONTEND ANGULAR + NGINX REVERSE PROXY
  talentus-scout-fe:
    build:
      context: ./talentus-scout-fe
      dockerfile: Dockerfile
    image: talentus-scout-fe:latest
    container_name: talentus-frontend-dev
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    depends_on:
      talentus-scout-be:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: "http://talentus-scout-be:8080"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./talentus-scout-fe/nginx.conf:/etc/nginx/http.d/default.conf:ro
      - ./talentus-scout-fe/entrypoint.sh:/app/entrypoint.sh:ro
    networks:
      - talentus-net

networks:
  talentus-net:
    driver: bridge
